name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.8
      - name: jactionlint
        run: mise run lint:actions
      - name: Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run actions:verify
      - name: Generated queries are current
        run: mise run sqlc:check
      - run: mise run lint
      - run: mise run build
      - run: mise run test
