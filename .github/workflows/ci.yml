name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.8
      - name: jactionlint
        run: go run github.com/jdx/jactionlint/v2/cmd/jactionlint@v2.5.0
      - name: Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - name: Generated queries are current
        run: mise run sqlc:check
      - run: mise run lint
      - run: mise run build
      - run: mise run test
