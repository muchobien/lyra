name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.31.1
      - name: Generated queries are current
        run: sqlc diff
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: go build -o bin/lyra ./cmd/lyra
      - run: mkdir -p "$RUNNER_TEMP/e2e" && WORK="$RUNNER_TEMP/e2e" scripts/e2e.zsh
      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP"/e2e/server*.log
