name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.8
        with:
          cache: false
      - name: Build archives
        run: mise run dist -- ${{ !startsWith(github.ref, 'refs/tags/v') && '--snapshot' || '' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/CHANGELOG.md

  image:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - id: packslip
        uses: jdx/packslip@v1.11.4
        with:
          artifacts: dist/*.tar.gz
          bin: lyra
          upload: false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packslip
          if-no-files-found: error
          path: ${{ steps.packslip.outputs.bundle }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packslip
          path: packslip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file dist/CHANGELOG.md \
            dist/*.tar.gz dist/checksums.txt packslip/packslip.sigstore.json
