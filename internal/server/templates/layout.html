<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Lyra</title>
<style>
:root { --bg: #fff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --panel: #f6f8fa; --link: #0969da; --ok: #1a7f37; --warn: #9a6700; --off: #656d76; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --panel: #161b22; --link: #4493f8; --ok: #3fb950; --warn: #d29922; --off: #8d96a0; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
header { border-bottom: 1px solid var(--line); background: var(--panel); }
header .bar, main { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
header .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header .brand { font-weight: 600; color: var(--fg); }
header .user { margin-left: auto; color: var(--muted); }
nav.tabs { display: flex; gap: 16px; margin: 8px 0 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 8px 0; }
h1 .muted { font-weight: 400; }
.muted { color: var(--muted); }
table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 6px; }
td, th { padding: 6px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
tr:first-child td, tr:first-child th { border-top: 0; }
th { background: var(--panel); font-weight: 600; }
pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.badge { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; font-size: 12px; white-space: nowrap; }
.badge.verified { color: var(--ok); }
.badge.unverified { color: var(--warn); }
.badge.unsigned { color: var(--off); }
.clone { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.clone input { flex: 1; min-width: 200px; font: 12px ui-monospace, Menlo, monospace; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.right { text-align: right; }
@media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="/">Lyra</a>{{with .Repo}}<a href="/{{esc .Name}}">{{.Name}}</a>{{end}}<span class="user">{{.User}}</span></div></header>
<main>
{{with .Repo}}
<h1>{{.Name}}{{with .Description}} <span class="muted">· {{.}}</span>{{end}}</h1>
<nav class="tabs"><a href="/{{esc .Name}}/tree/{{esc $.Ref}}/">Files</a><a href="/{{esc .Name}}/commits/{{esc $.Ref}}">Commits</a><a href="/{{esc .Name}}/tags">Tags</a></nav>
{{end}}
{{template "content" .}}
</main>
</body>
</html>
{{define "sig"}}<span class="badge {{.Status}}" title="{{with .Fingerprint}}{{.}}{{end}}{{with .KeyAgent}} · agent {{.}}{{end}}">{{if eq .Status "verified"}}Verified{{else if eq .Status "unverified"}}Unverified{{else}}Unsigned{{end}}</span>{{end}}
