{{define "content"}}
<h1>Repositories</h1>
{{if .Data}}
<table>
<tr><th>Name</th><th class="hide-sm">Description</th><th class="hide-sm">Created</th></tr>
{{range .Data}}<tr><td><a href="/{{esc .Name}}">{{.Name}}</a></td><td class="hide-sm muted">{{.Description}}</td><td class="hide-sm muted">{{.CreatedAt.Format "2006-01-02"}}</td></tr>
{{end}}
</table>
{{else}}
<p class="muted">No repositories yet. Create one with <code>lyra repo create &lt;name&gt;</code>.</p>
{{end}}
{{end}}
