      in: header
      name: Tailscale-User-Login
      type: apiKey
    token:
      description: A Lyra token.
      scheme: bearer
      type: http
info:
  description: |-
    The JSON API behind the lyra CLI. Errors are {"error": "..."} with a 4xx or 5xx status.

    Tokens have a scope (read < write < admin) and an optional list of repositories (owner/repo, or owner/*). Each
    operation names the scope it needs; "unrestricted" means a token without a repository list. The tailnet identity
    has full access.

    Lyra-Agent and Lyra-Session headers are recorded with every write, and writes return the event_id they recorded.
    While read-only mode is on, every write returns 503.
  title: Lyra API
  version: "0"
openapi: 3.1.0
paths:
  /api/admin/backup:
    post:
      description: "Scope: admin, unrestricted. Writes wait while the database and repositories are copied."
      operationId: createBackup
      responses:
        "200":
          content:
            application/x-tar:
              schema:
                type: string
          description: The backup
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Stream a backup as a tar
      tags:
        - Admin
  /api/admin/readonly:
    post:
      description: "Scope: admin, unrestricted. The mode lives in memory, so a restart turns it off."
      operationId: setReadOnly
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadOnlyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Turn read-only mode on or off
      tags:
        - Admin
  /api/admin/registry-gc:
    post:
      description: "Scope: admin, unrestricted. Lyra is read-only while it runs."
      operationId: collectRegistry
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryCollected"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Delete registry layers and manifests no tag refers to
      tags:
        - Admin
  /api/admin/status:
    get:
      description: "Scope: admin, unrestricted."
      operationId: getStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Read-only mode and the last backup
      tags:
        - Admin
  /api/admin/storage-check:
    get:
      description: "Scope: admin, unrestricted."
      operationId: checkStorage
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCheck"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Stored files the database refers to but storage lacks
      tags:
        - Admin
  /api/code.css:
    get:
      description: "Scope: any."
      operationId: getCodeStyles
      responses:
        "200":
          content:
            text/css:
              schema:
                type: string
          description: Chroma styles
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Read syntax highlighting styles for light and dark appearance
      tags:
        - Workspaces
  /api/events:
    get:
      description: "Scope: read. Account events (tokens, keys) need an unrestricted token."
      operationId: listEvents
      parameters:
        - explode: false
          in: query
          name: repo
          schema:
            type: string
        - description: 1 to 1000; defaults to 50.
          explode: false
          in: query
          name: limit
          schema:
            description: 1 to 1000; defaults to 50.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Event"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List recent events
      tags:
        - Events
  /api/events/stream:
    get:
      description: "Scope: read. Each message's id is the event id, its event the action, and its data an Event. The stream starts with an id line holding the current position and sends a keepalive every 25 seconds. Tokens see only events for repositories they can read. Every event delivered on an item stream moves the position since=mine starts from."
      operationId: streamEvents
      parameters:
        - explode: false
          in: query
          name: repo
          schema:
            type: string
        - description: One issue or pull request number; needs repo.
          explode: false
          in: query
          name: item
          schema:
            description: One issue or pull request number; needs repo.
            format: int64
            type: integer
        - description: Glob patterns, such as push or repo.*
          explode: true
          in: query
          name: action
          schema:
            description: Glob patterns, such as push or repo.*
            items:
              type: string
            type: array
        - description: Only *.assigned events for that name; me is the caller.
          explode: false
          in: query
          name: assignee
          schema:
            description: Only *.assigned events for that name; me is the caller.
            type: string
        - description: Leave out the caller's own events.
          explode: false
          in: query
          name: exclude_self
          schema:
            description: Leave out the caller's own events.
            type: boolean
        - description: "An event id to start after, or mine with item: see lyra pr wait."
          explode: false
          in: query
          name: since
          schema:
            description: "An event id to start after, or mine with item: see lyra pr wait."
            type: string
        - description: Resume after this event.
          in: header
          name: Last-Event-ID
          schema:
            description: Resume after this event.
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: Server-sent events
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Stream events as server-sent events
      tags:
        - Events
  /api/keys:
    get:
      description: "Scope: read, unrestricted."
      operationId: listKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Key"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List the caller's SSH keys
      tags:
        - Account
    post:
      description: "Scope: admin, unrestricted. Signing keys verify commit and tag signatures."
      operationId: createKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Register an SSH signing key
      tags:
        - Account
  /api/keys/{id}:
    delete:
      description: "Scope: admin, unrestricted."
      operationId: deleteKey
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedID"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Delete an SSH key
      tags:
        - Account
  /api/markdown:
    post:
      description: "Scope: any. This read-only operation remains available during maintenance."
      operationId: renderMarkdown
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkdownRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderedMarkdown"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Preview sanitized Markdown
      tags:
        - Workspaces
  /api/me:
    get:
      description: "Scope: any."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: The caller's identity
      tags:
        - Account
  /api/owners:
    get:
      description: "Scope: any."
      operationId: listOwners
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OwnerGroup"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List owners with the repositories the caller can read
      tags:
        - Owners
    post:
      description: "Scope: admin, unrestricted."
      operationId: createOwner
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnerRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerWrite"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Create an owner
      tags:
        - Owners
  /api/owners/{owner}:
    delete:
      description: "Scope: admin, unrestricted."
      operationId: deleteOwner
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedWithEvent"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Delete an owner that has no repositories
      tags:
        - Owners
    get:
      description: "Scope: any."
      operationId: getOwner
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerGroup"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get an owner with its repositories
      tags:
        - Owners
  /api/repos:
    get:
      description: "Scope: read."
      operationId: listRepos
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RepoView"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List the repositories the caller can read
      tags:
        - Repositories
    post:
      description: "Scope: admin. The owner must exist."
      operationId: createRepo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoView"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Create a repository
      tags:
        - Repositories
  /api/repos/{owner}/{repo}:
    delete:
      description: "Scope: admin."
      operationId: deleteRepo
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedName"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Delete a repository with its releases and images
      tags:
        - Repositories
    get:
      description: "Scope: read."
      operationId: getRepo
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get a repository
      tags:
        - Repositories
  /api/repos/{owner}/{repo}/blob:
    get:
      description: "Scope: read."
      operationId: getRepositoryBlob
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - description: Branch, tag, or commit; defaults to the repository's default branch.
          explode: false
          in: query
          name: ref
          schema:
            description: Branch, tag, or commit; defaults to the repository's default branch.
            type: string
        - description: Path relative to the repository root.
          explode: false
          in: query
          name: path
          schema:
            description: Path relative to the repository root.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Read highlighted source or binary/large-file metadata
      tags:
        - Workspaces
  /api/repos/{owner}/{repo}/commits:
    get:
      description: "Scope: read."
      operationId: listCommits
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - description: Defaults to the default branch.
          explode: false
          in: query
          name: ref
          schema:
            description: Defaults to the default branch.
            type: string
        - description: 1 to 500; defaults to 30.
          explode: false
          in: query
          name: limit
          schema:
            description: 1 to 500; defaults to 30.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Commit"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List commits
      tags:
        - Repositories
  /api/repos/{owner}/{repo}/commits/{rev}:
    get:
      description: "Scope: read."
      operationId: getCommit
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: rev
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commit"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get a commit
      tags:
        - Repositories
  /api/repos/{owner}/{repo}/commits/{rev}/view:
    get:
      description: "Scope: read."
      operationId: getCommitWorkspace
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: rev
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitWorkspace"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Read a commit with checks and structured diffs
      tags:
        - Workspaces
  /api/repos/{owner}/{repo}/files:
    get:
      description: "Scope: read."
      operationId: listRepositoryFiles
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - description: Branch, tag, or commit; defaults to the repository's default branch.
          explode: false
          in: query
          name: ref
          schema:
            description: Branch, tag, or commit; defaults to the repository's default branch.
            type: string
        - description: Path relative to the repository root.
          explode: false
          in: query
          name: path
          schema:
            description: Path relative to the repository root.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List recursive file paths for the file finder
      tags:
        - Workspaces
  /api/repos/{owner}/{repo}/images:
    get:
      description: "Scope: read. Images are pushed and pulled through the OCI distribution API at /v2/."
      operationId: listImages
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Image"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List container image tags
      tags:
        - Images
  /api/repos/{owner}/{repo}/issues:
    get:
      description: "Scope: read."
      operationId: listIssues
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - description: open (default), closed or all; merged too for pull requests.
          explode: false
          in: query
          name: state
          schema:
            description: open (default), closed or all; merged too for pull requests.
            type: string
        - description: Items carrying every one of these labels.
          explode: true
          in: query
          name: label
          schema:
            description: Items carrying every one of these labels.
            items:
              type: string
            type: array
        - description: Items assigned to every one of these names; @me is the caller.
          explode: true
          in: query
          name: assignee
          schema:
            description: Items assigned to every one of these names; @me is the caller.
            items:
              type: string
            type: array
        - description: Defaults to 100.
          explode: false
          in: query
          name: limit
          schema:
            description: Defaults to 100.
            format: int64
            type: integer
        - description: Search the title or an exact issue/pull request number.
          explode: false
          in: query
          name: q
          schema:
            description: Search the title or an exact issue/pull request number.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Item"
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: List issues
      tags:
        - Issues
    post:
      description: "Scope: write."
      operationId: createIssue
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemWrite"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Open an issue
      tags:
        - Issues
  /api/repos/{owner}/{repo}/issues/{number}:
    get:
      description: "Scope: read."
      operationId: getIssue
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: number
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemView"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get an issue with its comments
      tags:
        - Issues
    patch:
      description: "Scope: write. Each change is recorded as its own event; event_id is the last one."
      operationId: editIssue
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: number
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemWrite"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Edit an issue
      tags:
        - Issues
  /api/repos/{owner}/{repo}/issues/{number}/comments:
    post:
      description: "Scope: write."
      operationId: commentIssue
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: number
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWrite"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Comment on an issue
      tags:
        - Issues
  /api/repos/{owner}/{repo}/issues/{number}/view:
    get:
      description: "Scope: read."
      operationId: getIssueWorkspace
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
        - in: path
          name: repo
          required: true
          schema:
            type: string
        - in: path
          name: number
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
