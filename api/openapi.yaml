components:
  schemas:
    Actor:
      additionalProperties: false
      properties:
        agent:
          type: string
        session:
          type: string
        user:
          type: string
        via:
          type: string
      required:
        - user
        - via
      type: object
    Asset:
      additionalProperties: false
      properties:
        content_type:
          type: string
        created_at:
          format: date-time
          type: string
        download_url:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
        uploader:
          $ref: "#/components/schemas/Actor"
      required:
        - id
        - name
        - size
        - sha256
        - content_type
        - uploader
        - created_at
      type: object
    AssetWrite:
      additionalProperties: false
      properties:
        content_type:
          type: string
        created_at:
          format: date-time
          type: string
        download_url:
          type: string
        event_id:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        name:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
        uploader:
          $ref: "#/components/schemas/Actor"
      required:
        - event_id
        - id
        - name
        - size
        - sha256
        - content_type
        - uploader
        - created_at
      type: object
    BlobResponse:
      additionalProperties: false
      properties:
        binary:
          type: boolean
        code:
          type: string
        path:
          type: string
        size:
          format: int64
          type: integer
      required:
        - path
        - size
        - code
        - binary
      type: object
    Check:
      additionalProperties: false
      properties:
        event:
          type: string
        job_id:
          format: int64
          type: integer
        name:
          type: string
        run:
          format: int64
          type: integer
        status:
          type: string
        workflow:
          type: string
      required:
        - run
        - workflow
        - event
        - job_id
        - name
        - status
      type: object
    Checks:
      additionalProperties: false
      properties:
        jobs:
          items:
            $ref: "#/components/schemas/Check"
          type: array
        sha:
          type: string
        state:
          type: string
      required:
        - state
        - sha
        - jobs
      type: object
    Comment:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/Actor"
        body:
          type: string
        commit_sha:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        outdated:
          type: boolean
        path:
          type: string
        review_id:
          format: int64
          type: integer
        side:
          type: string
      required:
        - id
        - body
        - author
        - created_at
      type: object
    CommentRequest:
      additionalProperties: false
      properties:
        body:
          type: string
        head_sha:
          description: Reject a line comment if the pull request changed from this head.
          type: string
        line:
          description: "Pull requests only: a line of path in the diff."
          format: int64
          type: integer
        path:
          description: "Pull requests only: a file in the diff."
          type: string
        side:
          description: new is the head version, old the base version.
          enum:
            - new
            - old
          type: string
      required:
        - body
      type: object
    CommentWrite:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/Actor"
        body:
          type: string
        commit_sha:
          type: string
        created_at:
          format: date-time
          type: string
        event_id:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        line:
          format: int64
          type: integer
        outdated:
          type: boolean
        path:
          type: string
        review_id:
          format: int64
          type: integer
        side:
          type: string
      required:
        - event_id
        - id
        - body
        - author
        - created_at
      type: object
    Commit:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/Person"
        body:
          type: string
        committer:
          $ref: "#/components/schemas/Person"
        parents:
          items:
            type: string
          type: array
        sha:
          type: string
        signature:
          $ref: "#/components/schemas/Signature"
        subject:
          type: string
      required:
        - sha
        - parents
        - author
        - committer
        - subject
        - body
        - signature
      type: object
    CommitWorkspace:
      additionalProperties: false
      properties:
        checks:
          $ref: "#/components/schemas/Checks"
        commit:
          $ref: "#/components/schemas/Commit"
        files:
          items:
            $ref: "#/components/schemas/DiffFile"
          type: array
      required:
        - commit
        - checks
        - files
      type: object
    CreateIssueRequest:
      additionalProperties: false
      properties:
        assignees:
          description: Logins or agent names; @me is the caller.
          items:
            type: string
          type: array
        body:
          type: string
        labels:
          description: Labels must exist.
          items:
            type: string
          type: array
        title:
          type: string
      required:
        - title
      type: object
    CreateKeyRequest:
      additionalProperties: false
      properties:
        agent:
          type: string
        public_key:
          description: One OpenSSH public key line
          type: string
        signing:
          description: "Must be true: only signing keys are supported"
          type: boolean
        title:
          type: string
      required:
        - public_key
        - signing
      type: object
    CreateLabelRequest:
      additionalProperties: false
      properties:
        color:
          description: "Hex without #, such as d73a4a."
          type: string
        description:
          type: string
        name:
          type: string
      required:
        - name
      type: object
    CreateOwnerRequest:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
      required:
        - name
      type: object
    CreatePullRequest:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type: array
        base:
          description: Defaults to the default branch.
          type: string
        body:
          type: string
        head:
          description: The branch to merge.
          type: string
        labels:
          items:
            type: string
          type: array
        title:
          type: string
      required:
        - title
        - head
      type: object
    CreateReleaseRequest:
      additionalProperties: false
      properties:
        draft:
          type: boolean
        generate_notes:
          description: List the pull requests merged since the last release.
          type: boolean
        notes:
          type: string
        prerelease:
          type: boolean
        tag:
          type: string
        target:
          description: Branch or commit to tag; defaults to the default branch.
          type: string
        title:
          description: Defaults to the tag.
          type: string
      required:
        - tag
      type: object
    CreateRepoRequest:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          description: owner/name
          type: string
      required:
        - name
      type: object
    CreateTokenRequest:
      additionalProperties: false
      properties:
        expires_in:
          description: A Go duration, such as 720h
          type: string
        name:
          type: string
        repos:
          description: owner/repo or owner/*; empty means unrestricted
          items:
            type: string
          type: array
        scope:
          enum:
            - read
            - write
            - admin
          type: string
      required:
        - name
        - scope
      type: object
    DeletedID:
      additionalProperties: false
      properties:
        deleted:
          format: int64
          type: integer
      required:
        - deleted
      type: object
    DeletedIDWithEvent:
      additionalProperties: false
      properties:
        deleted:
          format: int64
          type: integer
        event_id:
          format: int64
          type: integer
      required:
        - deleted
        - event_id
      type: object
    DeletedName:
      additionalProperties: false
      properties:
        deleted:
          type: string
      required:
        - deleted
      type: object
    DeletedWithEvent:
      additionalProperties: false
      properties:
        deleted:
          type: string
        event_id:
          format: int64
          type: integer
      required:
        - deleted
        - event_id
      type: object
    DiffFile:
      additionalProperties: false
      properties:
        binary:
          type: boolean
        lines:
          items:
            $ref: "#/components/schemas/DiffLine"
          type: array
        old_path:
          type: string
        path:
          type: string
      required:
        - path
        - old_path
        - binary
        - lines
      type: object
    DiffLine:
      additionalProperties: false
      properties:
        comments:
          items:
            $ref: "#/components/schemas/Comment"
          type: array
        html:
          type: string
        kind:
          type: string
        new:
          format: int64
          type: integer
        old:
          format: int64
          type: integer
        text:
          type: string
      required:
        - kind
        - old
        - new
        - text
        - html
        - comments
      type: object
    DispatchRequest:
      additionalProperties: false
      properties:
        inputs:
          additionalProperties:
            type: string
          type: object
        ref:
          description: Defaults to the default branch.
          type: string
        workflow:
          description: The workflow file name.
          type: string
      required:
        - workflow
      type: object
    EditItemRequest:
      additionalProperties: false
      properties:
        add_assignees:
          items:
            type: string
          type: array
        add_labels:
          items:
            type: string
          type: array
        body:
          type:
            - string
            - "null"
        remove_assignees:
          items:
            type: string
          type: array
        remove_labels:
          items:
            type: string
          type: array
        state:
          enum:
            - open
            - closed
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
      type: object
    EditReleaseRequest:
      additionalProperties: false
      properties:
        draft:
          description: false publishes a draft.
          type:
            - boolean
            - "null"
        notes:
          type:
            - string
            - "null"
        prerelease:
          type:
            - boolean
            - "null"
        target:
          description: Drafts only.
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
      type: object
    Entry:
      additionalProperties: false
      properties:
        mode:
          type: string
        name:
          type: string
        sha:
          type: string
        size:
          format: int64
          type: integer
        type:
          type: string
      required:
        - name
        - type
        - mode
        - sha
        - size
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        error:
          type: string
      required:
        - error
      type: object
    Event:
      additionalProperties: false
      properties:
        action:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        at:
          format: date-time
          type: string
        data: {}
        id:
          format: int64
          type: integer
        item:
          format: int64
          type: integer
        repo:
          type: string
      required:
        - id
        - at
        - action
        - actor
        - data
      type: object
    FileChange:
      additionalProperties: false
      properties:
        additions:
          format: int64
          type: integer
        binary:
          type: boolean
        deletions:
          format: int64
          type: integer
        old_path:
          type: string
        path:
          type: string
        status:
          type: string
      required:
        - path
        - status
        - additions
        - deletions
      type: object
    Image:
      additionalProperties: false
      properties:
        digest:
          type: string
        media_type:
          type: string
        name:
          type: string
        pushed_at:
          format: date-time
          type: string
        pusher:
          $ref: "#/components/schemas/Actor"
        reference:
          type: string
        repo:
          type: string
        tag:
          type: string
      required:
        - repo
        - name
        - tag
        - digest
        - media_type
        - pusher
        - pushed_at
      type: object
    Item:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type: array
        author:
          $ref: "#/components/schemas/Actor"
        body:
          type: string
        closed_at:
          format: date-time
          type:
            - string
            - "null"
        comment_count:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        kind:
          type: string
        labels:
          items:
            type: string
          type: array
        number:
          format: int64
          type: integer
        repo:
          type: string
        state:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - number
        - repo
        - kind
        - title
        - body
        - state
        - author
        - labels
        - assignees
        - comment_count
        - created_at
        - updated_at
        - closed_at
      type: object
    ItemView:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type: array
        author:
          $ref: "#/components/schemas/Actor"
        body:
          type: string
        closed_at:
          format: date-time
          type:
            - string
            - "null"
        comment_count:
          format: int64
          type: integer
        comments:
          items:
            $ref: "#/components/schemas/Comment"
          type: array
        created_at:
          format: date-time
          type: string
        kind:
          type: string
        labels:
          items:
            type: string
          type: array
        number:
          format: int64
          type: integer
        repo:
          type: string
        state:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - comments
        - number
        - repo
        - kind
        - title
        - body
        - state
        - author
        - labels
        - assignees
        - comment_count
        - created_at
        - updated_at
        - closed_at
      type: object
    ItemWorkspace:
      additionalProperties: false
      properties:
        can_write:
          type: boolean
        checks:
          anyOf:
            - $ref: "#/components/schemas/Checks"
            - type: "null"
        comments:
          items:
            $ref: "#/components/schemas/RenderedComment"
          type: array
        html:
          type: string
        is_author:
          type: boolean
        item:
          $ref: "#/components/schemas/Item"
        merge:
          anyOf:
            - $ref: "#/components/schemas/MergePlan"
            - type: "null"
        merge_error:
          type: string
        pull:
          anyOf:
            - $ref: "#/components/schemas/Pull"
            - type: "null"
        reviews:
          items:
            $ref: "#/components/schemas/RenderedReview"
          type: array
      required:
        - item
        - pull
        - html
        - comments
        - reviews
        - merge
        - merge_error
        - checks
        - can_write
        - is_author
      type: object
    ItemWrite:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type: array
        author:
          $ref: "#/components/schemas/Actor"
        body:
          type: string
        closed_at:
          format: date-time
          type:
            - string
            - "null"
        comment_count:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        event_id:
          format: int64
          type: integer
        kind:
          type: string
        labels:
          items:
            type: string
          type: array
        number:
          format: int64
          type: integer
        repo:
          type: string
        state:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - number
        - repo
        - kind
        - title
        - body
        - state
        - author
        - labels
        - assignees
        - comment_count
        - created_at
        - updated_at
        - closed_at
      type: object
    Job:
      additionalProperties: false
      properties:
        attempt:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        key:
          type: string
        name:
          type: string
        needs:
          items:
            type: string
          type: array
        outputs:
          additionalProperties:
            type: string
          type: object
        runs_on:
          items:
            type: string
          type: array
        started_at:
          format: date-time
          type:
            - string
            - "null"
        status:
          type: string
        steps:
          items:
            $ref: "#/components/schemas/TaskStep"
          type: array
        stopped_at:
          format: date-time
          type:
            - string
            - "null"
        task_id:
          format: int64
          type: integer
      required:
        - id
        - key
        - name
        - needs
        - runs_on
        - status
        - attempt
        - outputs
        - started_at
        - stopped_at
        - steps
      type: object
    Key:
      additionalProperties: false
      properties:
        agent:
          type: string
        created_at:
          format: date-time
          type: string
        fingerprint:
          type: string
        id:
          format: int64
          type: integer
        public_key:
          type: string
        signing:
          type: boolean
        title:
          type: string
        user:
          type: string
      required:
        - id
        - user
        - title
        - agent
        - public_key
        - fingerprint
        - signing
        - created_at
      type: object
    Label:
      additionalProperties: false
      properties:
        color:
          type: string
        description:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        repo:
          type: string
      required:
        - id
        - repo
        - name
        - color
        - description
      type: object
    LabelWrite:
      additionalProperties: false
      properties:
        color:
          type: string
        description:
          type: string
        event_id:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        name:
          type: string
        repo:
          type: string
      required:
        - event_id
        - id
        - repo
        - name
        - color
        - description
      type: object
    LastBackup:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        bytes:
          format: int64
          type: integer
        objects:
          format: int64
          type: integer
        pause_ms:
          format: int64
          type: integer
        repos:
          format: int64
          type: integer
      required:
        - at
        - bytes
        - objects
        - pause_ms
        - repos
      type: object
    LineComment:
      additionalProperties: false
      properties:
        body:
          type: string
        commit_sha:
          type: string
        line:
          format: int64
          type: integer
        path:
          type: string
        side:
          type: string
      required:
        - body
      type: object
    MarkdownRequest:
      additionalProperties: false
      properties:
        body:
          type: string
      required:
        - body
      type: object
    MeView:
      additionalProperties: false
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        repos:
          items:
            type: string
          type: array
        scope:
          type: string
      required:
        - actor
        - repos
        - scope
      type: object
    MergePlan:
      additionalProperties: false
      properties:
        base_sha:
          type: string
        blocked:
          items:
            type: string
          type: array
        conflicts:
          items:
            type: string
          type: array
        fast_forward:
          type: boolean
        head_sha:
          type: string
        methods:
          items:
            type: string
          type: array
      required:
        - head_sha
        - base_sha
        - fast_forward
        - conflicts
        - methods
        - blocked
      type: object
    MergeRequest:
      additionalProperties: false
      properties:
        delete_branch:
          type: boolean
        head_sha:
          description: Refuse the merge unless the head branch is at this commit.
          type: string
        message:
          description: Squash commit body.
          type: string
        method:
          enum:
            - squash
            - ff
          type: string
        title:
          description: Squash commit title; defaults to the title with (#number).
          type: string
      required:
        - method
      type: object
    NameRequest:
      additionalProperties: false
      properties:
        name:
          type: string
      required:
        - name
      type: object
    NotePull:
      additionalProperties: false
      properties:
        author:
          type: string
        number:
          format: int64
          type: integer
        title:
          type: string
      required:
        - number
        - title
        - author
      type: object
    OwnerGroup:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        name:
          type: string
        repos:
          items:
            $ref: "#/components/schemas/Repo"
          type: array
        user:
          type: string
      required:
        - repos
        - name
        - description
        - user
        - created_at
      type: object
    OwnerWrite:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        event_id:
          format: int64
          type: integer
        name:
          type: string
        user:
          type: string
      required:
        - event_id
        - name
        - description
        - user
        - created_at
      type: object
    Person:
      additionalProperties: false
      properties:
        date:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - name
        - email
        - date
      type: object
    Pull:
      additionalProperties: false
      properties:
        assignees:
          items:
            type: string
          type: array
        author:
          $ref: "#/components/schemas/Actor"
        base:
          type: string
        base_sha:
          type: string
        body:
          type: string
        closed_at:
          format: date-time
          type:
            - string
            - "null"
        comment_count:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        head:
          type: string
        head_sha:
          type: string
        kind:
          type: string
        labels:
          items:
            type: string
          type: array
        merge_sha:
          type: string
        merged_at:
          format: date-time
          type:
            - string
            - "null"
        number:
          format: int64
          type: integer
        repo:
          type: string
        state:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - base
        - head
        - head_sha
        - base_sha
        - merged_at
        - number
        - repo
        - kind
        - title
        - body
        - state
        - author
        - labels
        - assignees
        - comment_count
        - created_at
        - updated_at
        - closed_at
      type: object
    PullPatch:
      additionalProperties: false
      properties:
        files:
          items:
            $ref: "#/components/schemas/DiffFile"
          type: array
        head_sha:
          type: string
